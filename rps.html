<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors (ConsoleVersion)</title>
</head>
<body>

<!--- There is no GUI yet, RPS will be played in the Console of DevTools -->


    <script>
        console.log("Hello")

        //CREATE function getComputerChoice
        function getComputerChoice() {
        // CREATE variable choice becomes Math.random
        let choice = Math.random();
        // CREATE variable result 
        let result;
        //ADD if-structure with Math.random(lower than 0.333) PRINT "Rock"
        if (choice < 0.333) {
            result = "Rock";
            }
        //ADD else if Math.random(bigger or equal to 0.333 and lower than 0.666) PRINT "Paper"
            else if (choice >= 0.333 && choice < 0.666) {
                result = "Paper";
        //ADD else Math.random() Print "Scissors"
            }
            else {
                result = "Scissors";
            }
        //CHECK with console.log()
            console.log(result)
        }
        //CALL function getComputerChoice 
        getComputerChoice();


        //CREATE function getHumanChoice
        function getHumanChoice() {
        //PROMPT for variable x with request to enter "Enter Rock, Paper or Scissors"
        let x = prompt("Enter Rock, Paper or Scissors", "");
        //CONTROL with console.log
        console.log(x)
        }
        //CALL function getHumanChoice()
        getHumanChoice()
        //DISREGARD if user enters invalid input
        //FOR NOW case-sensitive input
       
    </script>


</body>
</html>
