<!DOCTYPE html>

<body>

<!--- There is no GUI yet, RPS will be played in the Console of DevTools -->


    <script>
        console.log("Hello")

        //CREATE function getComputerChoice
        function getComputerChoice() {
        // CREATE variable choice becomes Math.random
            let choice = Math.random();
            let computerChoice;
        //ADD if-structure with Math.random(lower than 0.333) PRINT "Rock"
            if (choice < 0.333) {
            computerChoice = "rock";
            }
        //ADD else if Math.random(bigger or equal to 0.333 and lower than 0.666) PRINT "Paper"
            else if (choice >= 0.333 && choice < 0.666) {
                computerChoice = "paper";
        //ADD else Math.random() Print "Scissors"
            }
            else {
                computerChoice = "scissors";
            }
        //CHECK with console.log()
            console.log(computerChoice)
            return computerChoice;
        }


        //CREATE function getHumanChoice
        function getHumanChoice() {
        //PROMPT for variable x with request to enter "Enter Rock, Paper or Scissors", make case-insensitive
            let choice = prompt("Enter Rock, Paper or Scissors", "").toLowerCase();
            let humanChoice
            if (choice === "rock") {
                humanChoice = "rock"
            } else if (choice === "paper") {
                humanChoice = "paper"
            } else if (choice === "scissors") {
                humanChoice = "scissors"
            }
        //CONTROL with console.log
            console.log(choice);
            return humanChoice;
        }
        //DISREGARD if user enters invalid input

       

        //CREATE function playRound
        //DEFINE two parameters for playRound: humanChoice and computerChoice
        //Use these two arguments to take the human and computer choices as arguments
    function playGame() {
        
        let humanScore = 0;
        let computerScore = 0;

        function playRound(humanChoice, computerChoice){
        //How can I get humanChoice and computerChoice comparable? If-clauses?
        //Write Code in Function
            if (humanChoice === "rock" && computerChoice === "paper") {
        //INCREMENT the humanScore or computerScore based on the round winner. For-Loop?
                computerScore++;
        //OUTPUT String in console.log presenting the Winner "You won! etc."
                alert ("CPU wins! Paper beats rock.")
            } else if (humanChoice === "scissors" && computerChoice === "paper") {
                humanScore++;
                alert ("You win, scissors beat paper.")
            } else if (humanChoice === "paper" && computerChoice === "rock"){ 
                humanScore++;
                alert("You win, paper beats rocks.")
            } else if (humanChoice === "scissors" && computerChoice === "rock") {
                computerScore++;
                alert("CPU wins! Rock beats scissors.")
            } else if (humanChoice === "rock" && computerChoice === "scissors") {
                humanScore++;
                alert("You win! Rock beats scissors.")
            } else if (humanChoice === "paper" && computerChoice === "scissors") {
                computerScore++;
                alert("CPU wins! Scissors beat paper.")
            } else if (humanChoice === computerChoice) {
                alert ("Tie!")
            } else {
                computerScore++
                alert("No choice input. CPU wins by default.")
            }
        //PRINT score to user
            alert (`You: ${humanScore} | CPU:  ${computerScore}`)
            }

    //CREATE while loop 
    // SET to 5 times 
    // DECLARE r
        let r = 1; 
        while (r <= 5) {
        playRound(getHumanChoice(), getComputerChoice())
        r++
        }


    //CREATE function to compare score
        function compareScores() {
            if (humanScore > computerScore) {
    //PRINT Final Score           
                alert(`Final Score\nYou: ${humanScore} | CPU: ${computerScore}\nYay, you won!`)
            } else if (humanScore < computerScore) {
                alert(`Final Score\nYou: ${humanScore} | CPU: ${computerScore}\nL, you loose :-(`)
            } else if (humanScore === computerScore) {
                alert(`Final Score\nYou: ${humanScore} | CPU: ${computerScore}\nTIE! Boring...`)
            }
        }
    
        compareScores()

    }  

playGame()

</script>
